<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>추석 연휴 매체별 업무일정 안내 (메일용)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
  :root{
    --ink:#1B2340; --ink-soft:#4B5468; --ink-faint:#8A93A6;
    --line:#DEE1DA; --moon:#E8B44D;
    --persimmon:#C0503B; --persimmon-soft:#F5DCD4;
    --gold:#A9791B; --gold-soft:#F1E6C8;
    --pine:#3F7D57;
    --serif:'Nanum Gothic',sans-serif;
    --sans:'Nanum Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:transparent;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5;}
  .wrap{max-width:680px;margin:0 auto;padding:24px 20px 60px;}

  .subject-box{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .subject-box .lbl{font-size:11px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em;margin-bottom:3px;}
  .subject-box .txt{font-size:13.5px;font-weight:700;color:var(--ink);}
  .copy-btn{font-family:var(--sans);font-size:12px;padding:6px 12px;border-radius:16px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;}
  .copy-btn:hover{background:var(--ink);color:#fff;}
  .toolbar-row{display:flex;justify-content:flex-end;margin-bottom:20px;}
  .copy-btn.primary{background:var(--ink);color:#fff;}
  .copy-btn.primary:hover{background:#2A3557;}

  #emailArea{max-width:640px;width:100%;margin:0;}

  /* ---------- Chuseok banner (전체 페이지와 동일 톤) ---------- */
  .chuseok-banner{position:relative;overflow:hidden;border-radius:14px;margin:0 0 24px;
    background-color:#232A52;background-image:linear-gradient(160deg,#171B37 0%,#232A52 55%,#2B3565 100%);}
  .banner-inner{position:relative;z-index:3;padding:26px 24px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .banner-moon{position:absolute;top:-34px;right:-22px;width:130px;height:130px;border-radius:50%;
    background-color:var(--moon);
    background-image:radial-gradient(circle at 36% 32%,#FEF7D9,var(--moon) 55%,#C98F2E 100%);z-index:1;}
  .banner-persimmon{position:absolute;top:4px;right:10px;width:108px;height:auto;z-index:2;opacity:.96;}
  .banner-pine{position:absolute;bottom:-4px;left:-8px;width:70px;height:auto;z-index:2;opacity:.9;}
  .banner-eyebrow{font-size:11px;color:#B9C0E0;margin-bottom:6px;letter-spacing:.02em;}
  .banner-title{font-weight:800;font-size:19px;color:#FCEFC8;margin:0 0 6px;letter-spacing:-.01em;line-height:1.35;}
  .banner-sub{font-size:12.5px;color:#C7CDEA;margin:0;line-height:1.6;white-space:nowrap;}
  .banner-dday{flex:0 0 auto;width:62px;height:62px;border-radius:50%;
    background-color:var(--moon);
    background-image:radial-gradient(circle at 34% 30%,#FEF7D9,var(--moon) 60%,#C98F2E 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#221807;}
  .banner-dday .dday-num{font-weight:800;font-size:15px;line-height:1;}
  .banner-dday .dday-lbl{font-size:7.5px;font-weight:700;margin-top:2px;letter-spacing:.02em;}

  .headline{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:24px;}
  .headline .eyebrow{font-size:12px;color:var(--ink-faint);margin-bottom:8px;}
  .headline h1{font-weight:800;font-size:22px;margin:0 0 8px;letter-spacing:-.01em;}
  .headline p{font-size:13.5px;color:var(--ink-soft);margin:0;}
  .stat-inline{display:inline-block;background:var(--persimmon-soft);color:var(--persimmon);font-weight:700;padding:1px 7px;border-radius:4px;margin:0 2px;}

  .section{margin-bottom:32px;}
  .section h2{font-size:16px;font-weight:800;margin:0 0 4px;}
  .section-sub{font-size:12px;color:var(--ink-soft);margin:0 0 14px;}

  .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .card{background:var(--persimmon-soft);border-left:3px solid var(--persimmon);border-radius:8px;padding:10px 12px;}
  .card .media{font-weight:700;font-size:12.5px;margin-bottom:5px;}
  .card .media .paren{font-weight:400;color:var(--ink-faint);font-size:11px;}
  .card .pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:9px;background:var(--persimmon);color:#fff;}
  .empty-note{font-size:12px;color:var(--ink-faint);padding:14px;background:#FBFBFA;border:1px dashed var(--line);border-radius:8px;text-align:center;}

  .status-line{font-size:12px;color:var(--ink-faint);text-align:center;padding:30px 0;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:99;}
  .toast.show{opacity:1;}

  @media(max-width:600px){ .card-grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:420px){ .card-grid{grid-template-columns:1fr;} }
</style>
</head>

    </div>
  </div>

</div>

function escapeHtml(s){
  return (s==null ? '' : String(s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function annotate(text){
  let t = (text||'').trim();
  let note = '';
  const pm = /^(.*?)\s*([（(][^）)]*[）)])\s*$/.exec(t);
  if(pm){ t = pm[1].trim(); note = pm[2]; }
  const idx = t.indexOf('※');
  if(idx >= 0){ note = (t.slice(idx).trim() + (note ? ' ' + note : '')).trim(); t = t.slice(0, idx).trim(); }
  return {main: t || '-', note};
}
function categoryOf(text){
  const t = (text||'').trim();
  if(t.includes('휴무')) return 'off';
  if(t.includes('단축') || t.includes('오전')) return 'short';
  if(t.includes('정상')) return 'normal';
  return 'other';
}

let LAST = {off:[], short:[], data:[]};

function offCardHtml(d){
  const {main, note} = annotate(d.media);
  const {main: statusMain} = annotate(d.d1);
  return `
  <div class="card">
    <div class="media">${escapeHtml(main)}${note?` <span class="paren">${escapeHtml(note)}</span>`:''}</div>
    <span class="pill">${escapeHtml(statusMain)}</span>
  </div>`;
}

            </td>
            <td style="border:none;background-color:#1B2340;white-space:nowrap;" align="right" valign="middle">
              <a href="${FULL_PAGE_URL}" target="_blank" rel="noopener" style="display:inline-block;background-color:#ffffff;color:#1B2340;font-weight:700;font-size:13px;text-decoration:none;padding:11px 20px;border-radius:20px;">전체 일정 열기 →</a>
            </td>
          </tr></table>
        </td>
      </tr></table>
      </div>
    </div>
  `;
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1800);
}

document.getElementById('copySubject').addEventListener('click', async ()=>{
  const text = document.getElementById('subjectText').textContent;
  try{ await navigator.clipboard.writeText(text); toast('메일 제목이 복사되었습니다'); }
  catch(e){ alert(text); }
});

document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  const area = document.getElementById('emailArea');
  const range = document.createRange();
  range.selectNodeContents(area);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  toast('본문 전체가 선택되었습니다 — Ctrl+C(맥은 Cmd+C)로 복사한 뒤 메일에 붙여넣으세요');
});

async function tryFetchOnce(url){
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.text();
}
function proxyAttempts(url){
  const enc = encodeURIComponent(url);
  return [url, `https://api.allorigins.win/raw?url=${enc}`, `https://corsproxy.io/?url=${enc}`, `https://api.codetabs.com/v1/proxy?quest=${enc}`];
}
function rowsFromSheet(csvText){
  const parsed = Papa.parse(csvText, {header:false, skipEmptyLines:false});
  const rows = parsed.data;
  let headerIdx=-1, mediaCol=-1, groupCol=-1, noteCol=-1, firstDateCol=-1, lastDateCol=-1;
  for(let i=0;i<rows.length;i++){
    const r = rows[i];
    const mc = r.findIndex(c=>(c||'').toString().trim()==='매체명');
    if(mc>=0){ headerIdx=i; mediaCol=mc; groupCol=r.findIndex(c=>(c||'').toString().trim()==='구분'); noteCol=r.findIndex(c=>(c||'').toString().trim()==='비고'); break; }
  }
  if(headerIdx<0 || mediaCol<0 || noteCol<0) return [];
  const dateHeaderRow = rows[headerIdx+1] || [];
  for(let c=mediaCol+1;c<noteCol;c++){
    if((dateHeaderRow[c]||'').toString().trim()){ if(firstDateCol<0) firstDateCol=c; lastDateCol=c; }
  }
  if(firstDateCol<0) firstDateCol = mediaCol+1;
  if(lastDateCol<0 || lastDateCol<=firstDateCol) lastDateCol = noteCol-1;
  const out = [];
  let lastGroup = '';
  for(let i=headerIdx+2;i<rows.length;i++){
    const r = rows[i];
    const media = (r[mediaCol]||'').toString().trim();
    if(!media) continue;
    const g = groupCol>=0 ? (r[groupCol]||'').toString().trim() : '';
    if(g) lastGroup = g;
    const d1 = (r[firstDateCol]||'').toString().trim();
    const d3 = (r[lastDateCol]||'').toString().trim();
    let d2 = '';
    for(let c=firstDateCol+1;c<lastDateCol;c++){ const v=(r[c]||'').toString().trim(); if(v){ d2=v; break; } }
    const note = (r[noteCol]||'').toString().trim();
    out.push({group: lastGroup || '기타', media, d1, d2: d2||'연휴', d3, note});
  }
  return out;
}
async function loadData(){
  for(const url of proxyAttempts(SHEET_URL)){
    try{
      const text = await tryFetchOnce(url);
      const rows = rowsFromSheet(text);
      if(rows.length){ render(rows); return true; }
    }catch(e){ continue; }
  }
  render(DEFAULT_DATA);
  return false;
}

render(DEFAULT_DATA);
loadData();
</script>
</body>
